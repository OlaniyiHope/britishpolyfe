<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Student · Course Registration</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f0f6fe;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .registration-portal {
            max-width: 1300px;
            width: 100%;
            background: #ffffff;
            border-radius: 44px;
            box-shadow: 0 30px 60px -18px rgba(0, 20, 40, 0.18);
            padding: 28px 30px 32px;
            transition: all 0.2s;
        }

        /* header */
        .portal-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 28px;
            gap: 14px;
        }

        .portal-header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0a1e32;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .portal-header h1 i {
            color: #7c3aed;
            font-size: 2rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .student-badge {
            background: #e6edf8;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: #1c3857;
            font-size: 0.9rem;
        }

        .student-badge i {
            margin-right: 6px;
            color: #2563eb;
        }

        .live-badge {
            background: #dc3545;
            color: white;
            font-weight: 600;
            font-size: 0.7rem;
            padding: 6px 16px 6px 14px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: livePulse 1.8s infinite;
        }

        @keyframes livePulse {
            0% { opacity: 0.75; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.75; transform: scale(0.97); }
        }

        /* summary cards */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .summary-card {
            background: #f8fbff;
            border-radius: 28px;
            padding: 16px 18px;
            border: 1px solid #e7eef9;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .summary-icon {
            width: 44px;
            height: 44px;
            background: #e2ebf9;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7c3aed;
            font-size: 1.2rem;
        }

        .summary-content .label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #4f6e8e;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .summary-content .value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0b1e31;
            line-height: 1.3;
        }

        /* toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            gap: 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f2f7fd;
            border-radius: 60px;
            padding: 0 8px 0 20px;
            flex: 1 1 220px;
            min-width: 160px;
            border: 1px solid transparent;
            transition: 0.15s;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.10);
        }

        .search-box i {
            color: #6f8aa8;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 12px 12px;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            color: #11273f;
        }

        .search-box input::placeholder {
            color: #8da3bd;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background: white;
            border: 1px solid #d8e2ef;
            padding: 7px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            color: #1d3957;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn i {
            font-size: 0.7rem;
            color: #617e9e;
        }

        .filter-btn:hover {
            background: #e9f0fa;
            border-color: #a6bdd9;
        }

        .filter-btn.active {
            background: #7c3aed;
            border-color: #7c3aed;
            color: white;
        }

        .filter-btn.active i {
            color: white;
        }

        /* course grid */
        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
            margin-top: 6px;
        }

        .course-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 20px 20px 18px;
            border: 1px solid #ebf1f9;
            box-shadow: 0 4px 12px rgba(0, 20, 30, 0.02);
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .course-card:hover {
            border-color: #c5d7ed;
            box-shadow: 0 12px 28px -8px rgba(22, 60, 110, 0.07);
            transform: translateY(-3px);
        }

        .course-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .course-card .code-badge {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 40px;
            background: #e9eff8;
            color: #1e3b5a;
        }

        .course-card .credits {
            font-size: 0.7rem;
            background: #f2f6fd;
            padding: 3px 12px;
            border-radius: 30px;
            color: #4b6b8a;
        }

        .course-card .course-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #0b1e31;
            margin: 4px 0 6px;
            line-height: 1.3;
        }

        .course-card .course-instructor {
            font-size: 0.8rem;
            color: #4f6e8e;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .course-card .course-instructor i {
            color: #7c3aed;
            font-size: 0.7rem;
        }

        .course-card .course-desc {
            font-size: 0.85rem;
            color: #2f4b69;
            line-height: 1.5;
            flex: 1;
            margin-bottom: 14px;
        }

        .course-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e8eff7;
            padding-top: 14px;
            margin-top: 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .course-card .schedule {
            font-size: 0.7rem;
            color: #5d7b9a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .course-card .schedule i {
            color: #7c3aed;
        }

        .register-btn {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .register-btn:hover {
            background: #5b21b6;
            transform: scale(1.02);
        }

        .register-btn:disabled {
            background: #b8cfe5;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .register-btn.registered {
            background: #059669;
        }

        .register-btn.registered:hover {
            background: #047857;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #4b6a89;
            background: #fafdff;
            border-radius: 48px;
            border: 1px dashed #c2d6ec;
        }

        .empty-state i {
            font-size: 2.8rem;
            color: #b0c8e0;
            margin-bottom: 12px;
        }

        /* footer */
        .portal-footer {
            margin-top: 28px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.78rem;
            color: #577392;
            border-top: 1px solid #e7eef8;
            padding-top: 20px;
        }

        .portal-footer i {
            margin-right: 4px;
        }

        /* responsive */
        @media (max-width: 700px) {
            .registration-portal { padding: 20px 16px 28px; }
            .portal-header h1 { font-size: 1.5rem; }
            .summary-grid { grid-template-columns: 1fr 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .course-grid { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 480px) {
            .summary-grid { grid-template-columns: 1fr; }
            .course-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="registration-portal" id="registrationApp">
    <!-- header -->
    <div class="portal-header">
        <h1><i class="fas fa-book-open"></i> Course Registration</h1>
        <div class="header-right">
            <span class="student-badge"><i class="fas fa-id-badge"></i> S-2026-014 · Sarah Chen</span>
            <span class="live-badge"><i class="fas fa-circle" style="font-size:0.45rem;"></i> LIVE</span>
        </div>
    </div>

    <!-- summary -->
    <div class="summary-grid">
        <div class="summary-card">
            <div class="summary-icon"><i class="fas fa-check-circle"></i></div>
            <div class="summary-content">
                <div class="label">Registered</div>
                <div class="value" id="registeredCount">0</div>
            </div>
        </div>
        <div class="summary-card">
            <div class="summary-icon"><i class="fas fa-clock"></i></div>
            <div class="summary-content">
                <div class="label">Available</div>
                <div class="value" id="availableCount">0</div>
            </div>
        </div>
        <div class="summary-card">
            <div class="summary-icon"><i class="fas fa-hourglass-half"></i></div>
            <div class="summary-content">
                <div class="label">Credits</div>
                <div class="value" id="totalCredits">0</div>
            </div>
        </div>
    </div>

    <!-- toolbar -->
    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search courses..." />
        </div>
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all"><i class="fas fa-th"></i> All</button>
            <button class="filter-btn" data-filter="open"><i class="fas fa-circle" style="color:#059669;"></i> Open</button>
            <button class="filter-btn" data-filter="waitlist"><i class="fas fa-clock" style="color:#d97706;"></i> Waitlist</button>
            <button class="filter-btn" data-filter="full"><i class="fas fa-times-circle" style="color:#b91c1c;"></i> Full</button>
        </div>
    </div>

    <!-- course grid -->
    <div class="course-grid" id="courseGrid">
        <!-- injected by js -->
    </div>

    <!-- footer -->
    <div class="portal-footer">
        <span><i class="far fa-clock"></i> updated: <span id="updateTime">just now</span></span>
        <span><i class="fas fa-sync-alt fa-fw"></i> auto‑sync</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ----- course data -----
        let courses = [
            { id: 1, code: 'CS 201', title: 'Data Structures', instructor: 'Dr. Alan Turing', credits: 3, status: 'open', schedule: 'MWF 10:00am', desc: 'Fundamental data structures and algorithms.' },
            { id: 2, code: 'CS 202', title: 'Algorithms', instructor: 'Prof. Grace Hopper', credits: 3, status: 'open', schedule: 'TTh 2:00pm', desc: 'Design and analysis of algorithms.' },
            { id: 3, code: 'CS 310', title: 'Database Systems', instructor: 'Dr. Edgar Codd', credits: 3, status: 'waitlist', schedule: 'MW 4:00pm', desc: 'Relational databases, SQL, and design.' },
            { id: 4, code: 'CS 260', title: 'Web Development', instructor: 'Prof. Tim Berners-Lee', credits: 4, status: 'open', schedule: 'TTh 11:00am', desc: 'Frontend and backend web technologies.' },
            { id: 5, code: 'MATH 220', title: 'Linear Algebra', instructor: 'Dr. Emmy Noether', credits: 3, status: 'full', schedule: 'MWF 8:00am', desc: 'Vector spaces, matrices, and linear transformations.' },
            { id: 6, code: 'PHYS 101', title: 'Intro to Physics', instructor: 'Prof. Richard Feynman', credits: 4, status: 'open', schedule: 'TTh 1:00pm', desc: 'Mechanics, thermodynamics, and waves.' },
            { id: 7, code: 'ENG 110', title: 'Composition I', instructor: 'Prof. Maya Angelou', credits: 3, status: 'open', schedule: 'MWF 2:00pm', desc: 'Academic writing and critical thinking.' },
            { id: 8, code: 'PSY 201', title: 'Cognitive Psychology', instructor: 'Dr. Daniel Kahneman', credits: 3, status: 'waitlist', schedule: 'TTh 3:30pm', desc: 'Memory, perception, and decision-making.' },
        ];

        // ----- state: registered course IDs -----
        let registeredIds = new Set([1, 4]); // initially registered for CS 201 and Web Dev

        // filter state
        let currentFilter = 'all';
        let searchTerm = '';

        // DOM refs
        const grid = document.getElementById('courseGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const registeredCountEl = document.getElementById('registeredCount');
        const availableCountEl = document.getElementById('availableCount');
        const totalCreditsEl = document.getElementById('totalCredits');
        const updateTimeSpan = document.getElementById('updateTime');

        // ----- helpers -----
        function updateTimestamp() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            updateTimeSpan.textContent = `${h}:${m}`;
        }

        function formatStatus(status) {
            const map = {
                'open': '<span style="color:#059669;font-weight:600;"><i class="fas fa-circle" style="font-size:0.5rem;"></i> Open</span>',
                'waitlist': '<span style="color:#d97706;font-weight:600;"><i class="fas fa-clock" style="font-size:0.5rem;"></i> Waitlist</span>',
                'full': '<span style="color:#b91c1c;font-weight:600;"><i class="fas fa-times-circle" style="font-size:0.5rem;"></i> Full</span>'
            };
            return map[status] || map.open;
        }

        function getStatusClass(status) {
            if (status === 'open') return 'open';
            if (status === 'waitlist') return 'waitlist';
            return 'full';
        }

        // ----- render -----
        function render() {
            // filter + search
            let filtered = courses.filter(c => {
                if (currentFilter !== 'all' && c.status !== currentFilter) return false;
                if (searchTerm.trim() !== '') {
                    const term = searchTerm.trim().toLowerCase();
                    return c.title.toLowerCase().includes(term) ||
                           c.code.toLowerCase().includes(term) ||
                           c.instructor.toLowerCase().includes(term);
                }
                return true;
            });

            // update summary
            const registered = courses.filter(c => registeredIds.has(c.id));
            const available = courses.filter(c => c.status === 'open' && !registeredIds.has(c.id));
            const totalCredits = registered.reduce((sum, c) => sum + c.credits, 0);

            registeredCountEl.textContent = registered.length;
            availableCountEl.textContent = available.length;
            totalCreditsEl.textContent = totalCredits;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-search-minus"></i>
                        <p style="font-weight:500;">No courses found</p>
                        <p style="font-size:0.85rem;">Try adjusting filters or search</p>
                    </div>
                `;
                updateTimestamp();
                return;
            }

            let html = '';
            filtered.forEach(c => {
                const isRegistered = registeredIds.has(c.id);
                const statusDisplay = formatStatus(c.status);
                const statusClass = getStatusClass(c.status);

                // button logic
                let btnHtml = '';
                if (isRegistered) {
                    btnHtml = `<button class="register-btn registered" data-id="${c.id}"><i class="fas fa-check"></i> Registered</button>`;
                } else if (c.status === 'full') {
                    btnHtml = `<button class="register-btn" disabled><i class="fas fa-times"></i> Full</button>`;
                } else if (c.status === 'waitlist') {
                    btnHtml = `<button class="register-btn" data-id="${c.id}"><i class="fas fa-clock"></i> Waitlist</button>`;
                } else {
                    btnHtml = `<button class="register-btn" data-id="${c.id}"><i class="fas fa-plus"></i> Register</button>`;
                }

                html += `
                    <div class="course-card" data-id="${c.id}">
                        <div class="card-top">
                            <span class="code-badge">${c.code}</span>
                            <span class="credits"><i class="fas fa-star" style="color:#7c3aed;font-size:0.6rem;"></i> ${c.credits} cr</span>
                        </div>
                        <div class="course-title">${c.title}</div>
                        <div class="course-instructor"><i class="fas fa-user-graduate"></i> ${c.instructor}</div>
                        <div class="course-desc">${c.desc}</div>
                        <div class="card-footer">
                            <span class="schedule"><i class="far fa-calendar-alt"></i> ${c.schedule}</span>
                            ${btnHtml}
                        </div>
                        <div style="margin-top:10px; font-size:0.7rem; color:#4f6e8e; border-top:1px solid #f0f5fc; padding-top:8px; display:flex; justify-content:space-between;">
                            <span>${statusDisplay}</span>
                            <span>${isRegistered ? '✓ Registered' : ''}</span>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            updateTimestamp();
        }

        // ----- register / unregister -----
        function toggleRegistration(id) {
            const course = courses.find(c => c.id === id);
            if (!course) return;

            // if already registered, unregister
            if (registeredIds.has(id)) {
                registeredIds.delete(id);
                render();
                return;
            }

            // can't register if full
            if (course.status === 'full') {
                alert('This course is full and cannot be registered.');
                return;
            }

            // register
            registeredIds.add(id);
            render();
            // show feedback
            const msg = `✅ Registered for "${course.title}" (${course.code})`;
            alert(msg);
        }

        // ----- event delegation -----
        grid.addEventListener('click', (e) => {
            const btn = e.target.closest('.register-btn');
            if (!btn) return;
            if (btn.disabled) return;
            const id = parseInt(btn.dataset.id);
            if (!isNaN(id)) toggleRegistration(id);
        });

        // ----- filter & search -----
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            render();
        });

        // ----- init -----
        render();

        // ----- live simulation: update timestamps & random status change -----
        setInterval(() => {
            updateTimestamp();

            // randomly flip a course status (for live feel)
            if (Math.random() > 0.7) {
                const randomIdx = Math.floor(Math.random() * courses.length);
                const course = courses[randomIdx];
                // don't change if already registered (avoid confusion)
                if (registeredIds.has(course.id)) return;

                const statuses = ['open', 'waitlist', 'full'];
                let newStatus = statuses[Math.floor(Math.random() * statuses.length)];
                while (newStatus === course.status) {
                    newStatus = statuses[Math.floor(Math.random() * statuses.length)];
                }
                course.status = newStatus;
                render();
            }
        }, 25000);
    })();
</script>
</body>
