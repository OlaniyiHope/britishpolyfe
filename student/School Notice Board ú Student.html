<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>School Notice Board · Student</title>
  <!-- Font Awesome 6 (free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* ----- reset & base ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
    }

    body {
      background: #eef3fa;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    /* main board */
    .notice-board {
      max-width: 1300px;
      width: 100%;
      background: #ffffff;
      border-radius: 44px;
      box-shadow: 0 30px 60px -18px rgba(0, 20, 40, 0.20);
      padding: 28px 30px 32px;
      transition: all 0.2s;
    }

    /* header */
    .board-header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
      gap: 14px;
    }

    .board-header h1 {
      font-size: 2rem;
      font-weight: 600;
      color: #0a1e32;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .board-header h1 i {
      color: #d97706;
      font-size: 2rem;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .live-badge {
      background: #dc3545;
      color: white;
      font-weight: 600;
      font-size: 0.7rem;
      letter-spacing: 0.3px;
      padding: 6px 16px 6px 14px;
      border-radius: 40px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      animation: livePulse 1.8s infinite;
    }

    @keyframes livePulse {
      0% { opacity: 0.75; transform: scale(0.97); }
      50% { opacity: 1; transform: scale(1.02); }
      100% { opacity: 0.75; transform: scale(0.97); }
    }

    .notice-count {
      background: #e6edf8;
      padding: 6px 18px;
      border-radius: 60px;
      font-weight: 500;
      color: #1c3857;
      font-size: 0.9rem;
    }

    .notice-count i {
      margin-right: 6px;
      color: #2563eb;
    }

    /* toolbar: search + filter */
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      gap: 16px;
    }

    .search-box {
      display: flex;
      align-items: center;
      background: #f2f7fd;
      border-radius: 60px;
      padding: 0 8px 0 20px;
      flex: 1 1 220px;
      min-width: 160px;
      border: 1px solid transparent;
      transition: 0.15s;
    }

    .search-box:focus-within {
      background: #ffffff;
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .search-box i {
      color: #6f8aa8;
    }

    .search-box input {
      border: none;
      background: transparent;
      padding: 12px 12px;
      font-size: 0.95rem;
      width: 100%;
      outline: none;
      color: #11273f;
    }

    .search-box input::placeholder {
      color: #8da3bd;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .filter-btn {
      background: white;
      border: 1px solid #d8e2ef;
      padding: 7px 18px;
      border-radius: 40px;
      font-weight: 500;
      font-size: 0.8rem;
      color: #1d3957;
      cursor: pointer;
      transition: 0.15s;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .filter-btn i {
      font-size: 0.7rem;
      color: #617e9e;
    }

    .filter-btn:hover {
      background: #e9f0fa;
      border-color: #a6bdd9;
    }

    .filter-btn.active {
      background: #2563eb;
      border-color: #2563eb;
      color: white;
    }

    .filter-btn.active i {
      color: white;
    }

    .add-btn {
      background: #0a1e32;
      border: none;
      color: white;
      padding: 8px 24px;
      border-radius: 60px;
      font-weight: 500;
      font-size: 0.9rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: 0.15s;
      box-shadow: 0 4px 10px rgba(0, 20, 40, 0.04);
    }

    .add-btn i {
      font-size: 0.85rem;
    }

    .add-btn:hover {
      background: #04131f;
      transform: scale(1.01);
    }

    /* ----- notice grid (responsive) ----- */
    .notice-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 24px 22px;
      margin: 6px 0 10px;
    }

    /* notice card */
    .notice-card {
      background: #ffffff;
      border-radius: 32px;
      padding: 22px 20px 20px;
      border: 1px solid #ebf1f9;
      box-shadow: 0 4px 12px rgba(0, 20, 30, 0.02);
      transition: 0.2s ease;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .notice-card:hover {
      border-color: #c5d7ed;
      box-shadow: 0 12px 28px -8px rgba(22, 60, 110, 0.07);
      transform: translateY(-3px);
    }

    .notice-card .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
    }

    .notice-card .badge-category {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.3px;
      padding: 4px 14px 4px 12px;
      border-radius: 40px;
      background: #e9eff8;
      color: #1e3b5a;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .badge-category i {
      font-size: 0.6rem;
    }

    .badge-category.urgent {
      background: #fee9e7;
      color: #b91c1c;
    }
    .badge-category.event {
      background: #dbeafe;
      color: #1e4b8f;
    }
    .badge-category.academic {
      background: #d1fae5;
      color: #0b6e4f;
    }
    .badge-category.general {
      background: #fef3c7;
      color: #8b6914;
    }

    .notice-card .date-tag {
      font-size: 0.7rem;
      background: #f2f6fd;
      padding: 3px 12px;
      border-radius: 30px;
      color: #4b6b8a;
      white-space: nowrap;
    }

    .notice-card .title {
      font-weight: 600;
      font-size: 1.1rem;
      color: #0b1e31;
      margin: 6px 0 8px;
      line-height: 1.3;
    }

    .notice-card .description {
      font-size: 0.9rem;
      color: #2f4b69;
      line-height: 1.5;
      flex: 1;
      margin-bottom: 14px;
    }

    .notice-card .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-top: 1px solid #e8eff7;
      padding-top: 14px;
      margin-top: 4px;
      flex-wrap: wrap;
      gap: 8px;
    }

    .notice-card .author {
      font-size: 0.75rem;
      color: #5d7b9a;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .notice-card .author i {
      font-size: 0.7rem;
      color: #2563eb;
    }

    .notice-card .action-icons {
      display: flex;
      gap: 14px;
      color: #7e95b2;
    }

    .notice-card .action-icons i {
      cursor: pointer;
      transition: 0.1s;
      font-size: 0.9rem;
    }

    .notice-card .action-icons i:hover {
      color: #2563eb;
    }

    .notice-card .action-icons .delete-icon:hover {
      color: #dc3545;
    }

    /* empty state */
    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      color: #4b6a89;
      background: #fafdff;
      border-radius: 48px;
      border: 1px dashed #c2d6ec;
    }

    .empty-state i {
      font-size: 2.8rem;
      color: #b0c8e0;
      margin-bottom: 12px;
    }

    /* footer */
    .board-footer {
      margin-top: 28px;
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      font-size: 0.78rem;
      color: #577392;
      border-top: 1px solid #e7eef8;
      padding-top: 20px;
    }

    .board-footer i {
      margin-right: 4px;
    }

    /* ----- responsive tweaks ----- */
    @media (max-width: 700px) {
      .notice-board { padding: 20px 16px 28px; }
      .board-header h1 { font-size: 1.5rem; }
      .notice-grid { grid-template-columns: 1fr 1fr; }
      .toolbar { flex-direction: column; align-items: stretch; }
      .add-btn { justify-content: center; }
    }

    @media (max-width: 480px) {
      .notice-grid { grid-template-columns: 1fr; }
      .board-header h1 { font-size: 1.4rem; }
      .filter-group { justify-content: center; }
    }
  </style>
</head>
<body>

<div class="notice-board" id="noticeApp">
  <!-- header -->
  <div class="board-header">
    <h1><i class="fas fa-bullhorn"></i> Notice Board</h1>
    <div class="header-actions">
      <span class="live-badge"><i class="fas fa-circle" style="font-size:0.45rem;"></i> LIVE</span>
      <span class="notice-count"><i class="fas fa-clipboard-list"></i> <span id="noticeCounter">0</span></span>
    </div>
  </div>

  <!-- toolbar -->
  <div class="toolbar">
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="searchInput" placeholder="Search notices..." />
    </div>
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all"><i class="fas fa-th"></i> All</button>
      <button class="filter-btn" data-filter="urgent"><i class="fas fa-exclamation-triangle" style="color:#b91c1c;"></i> Urgent</button>
      <button class="filter-btn" data-filter="event"><i class="fas fa-calendar-alt" style="color:#1e4b8f;"></i> Event</button>
      <button class="filter-btn" data-filter="academic"><i class="fas fa-book" style="color:#0b6e4f;"></i> Academic</button>
      <button class="filter-btn" data-filter="general"><i class="fas fa-info-circle" style="color:#8b6914;"></i> General</button>
    </div>
    <button class="add-btn" id="addNoticeBtn"><i class="fas fa-plus"></i> Add notice</button>
  </div>

  <!-- notice grid -->
  <div class="notice-grid" id="noticeGrid"></div>

  <!-- footer -->
  <div class="board-footer">
    <span><i class="far fa-clock"></i> updated: <span id="updateTime">just now</span></span>
    <span><i class="fas fa-sync-alt fa-fw"></i> auto‑sync</span>
  </div>
</div>

<script>
  (function() {
    "use strict";

    // ----- initial notices -----
    const defaultNotices = [
      { id: 1, title: "Midterm exam schedule", category: "academic", desc: "Midterm exams start March 25. Check your department for room assignments.", date: "Mar 18", author: "Admin" },
      { id: 2, title: "Science fair registration", category: "event", desc: "Register your project by April 5. Prizes for top 3 teams.", date: "Mar 20", author: "Science Club" },
      { id: 3, title: "Library system upgrade", category: "general", desc: "Library will be offline Mar 22–23. Online resources still available.", date: "Mar 19", author: "Library" },
      { id: 4, title: "Urgent: building closure", category: "urgent", desc: "Main building closed on Mar 21 due to maintenance. Classes moved online.", date: "Mar 17", author: "Facilities" },
      { id: 5, title: "Career fair 2026", category: "event", desc: "Meet recruiters from top companies. April 10, 10am–4pm in the gym.", date: "Mar 22", author: "Career Center" },
      { id: 6, title: "Scholarship deadline", category: "urgent", desc: "Apply for the Merit Scholarship by March 30. Late applications not accepted.", date: "Mar 16", author: "Financial Aid" },
      { id: 7, title: "Guest lecture: AI ethics", category: "academic", desc: "Dr. Sharma from MIT will speak on March 28. All students welcome.", date: "Mar 23", author: "CS Dept." },
    ];

    // ----- state -----
    let notices = [...defaultNotices];
    let currentFilter = 'all';
    let searchTerm = '';

    // DOM refs
    const grid = document.getElementById('noticeGrid');
    const searchInput = document.getElementById('searchInput');
    const filterBtns = document.querySelectorAll('.filter-btn');
    const counterSpan = document.getElementById('noticeCounter');
    const updateTimeSpan = document.getElementById('updateTime');

    // ----- helpers -----
    function updateTimestamp() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2,'0');
      const m = String(now.getMinutes()).padStart(2,'0');
      updateTimeSpan.textContent = `${h}:${m}`;
    }

    // category → badge class
    function getCategoryClass(cat) {
      const map = {
        'urgent': 'urgent',
        'event': 'event',
        'academic': 'academic',
        'general': 'general'
      };
      return map[cat] || 'general';
    }

    // category icon
    function getCategoryIcon(cat) {
      const map = {
        'urgent': 'fa-exclamation-triangle',
        'event': 'fa-calendar-alt',
        'academic': 'fa-graduation-cap',
        'general': 'fa-info-circle'
      };
      return map[cat] || 'fa-info-circle';
    }

    // ----- render -----
    function render() {
      // filter + search
      let filtered = notices.filter(n => {
        if (currentFilter !== 'all' && n.category !== currentFilter) return false;
        if (searchTerm.trim() !== '') {
          const term = searchTerm.trim().toLowerCase();
          return n.title.toLowerCase().includes(term) ||
                 n.desc.toLowerCase().includes(term) ||
                 n.author.toLowerCase().includes(term);
        }
        return true;
      });

      counterSpan.textContent = filtered.length;

      if (filtered.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-clipboard"></i>
            <p style="font-weight: 500; margin-top: 6px;">No notices found</p>
            <p style="font-size:0.85rem; margin-top:4px;">Try adjusting filters or search</p>
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach(n => {
        const catClass = getCategoryClass(n.category);
        const catIcon = getCategoryIcon(n.category);
        html += `
          <div class="notice-card" data-id="${n.id}">
            <div class="card-header">
              <span class="badge-category ${catClass}">
                <i class="fas ${catIcon}"></i> ${n.category}
              </span>
              <span class="date-tag"><i class="far fa-calendar-alt"></i> ${n.date}</span>
            </div>
            <div class="title">${n.title}</div>
            <div class="description">${n.desc}</div>
            <div class="card-footer">
              <span class="author"><i class="fas fa-user-edit"></i> ${n.author}</span>
              <div class="action-icons">
                <i class="far fa-edit" data-action="edit" data-id="${n.id}"></i>
                <i class="far fa-trash-alt delete-icon" data-action="delete" data-id="${n.id}"></i>
              </div>
            </div>
          </div>
        `;
      });

      grid.innerHTML = html;
      updateTimestamp();
    }

    // ----- CRUD -----
    function addNotice() {
      const title = prompt('Notice title:');
      if (title === null || title.trim() === '') return;
      const desc = prompt('Description:') || '—';
      const category = prompt('Category (urgent / event / academic / general):', 'general') || 'general';
      const author = prompt('Author / department:') || 'Staff';
      const date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      const newId = notices.length ? Math.max(...notices.map(n => n.id)) + 1 : 1;
      notices.push({
        id: newId,
        title: title.trim(),
        desc: desc.trim(),
        category: category.trim().toLowerCase(),
        author: author.trim(),
        date: date,
      });
      render();
    }

    function deleteNotice(id) {
      if (!confirm('Delete this notice?')) return;
      notices = notices.filter(n => n.id !== id);
      render();
    }

    function editNotice(id) {
      const notice = notices.find(n => n.id === id);
      if (!notice) return;
      const newTitle = prompt('Edit title:', notice.title);
      if (newTitle === null) return;
      const newDesc = prompt('Edit description:', notice.desc);
      if (newDesc === null) return;
      const newCat = prompt('Edit category (urgent/event/academic/general):', notice.category);
      let cat = notice.category;
      if (newCat !== null && ['urgent','event','academic','general'].includes(newCat.trim().toLowerCase())) {
        cat = newCat.trim().toLowerCase();
      }
      const newAuthor = prompt('Edit author:', notice.author);
      if (newAuthor === null) return;
      notice.title = newTitle.trim() || notice.title;
      notice.desc = newDesc.trim() || notice.desc;
      notice.category = cat;
      notice.author = newAuthor.trim() || notice.author;
      notice.date = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      render();
    }

    // ----- event delegation (edit/delete) -----
    grid.addEventListener('click', (e) => {
      const target = e.target.closest('[data-action]');
      if (!target) return;
      const action = target.dataset.action;
      const id = Number(target.dataset.id);
      if (isNaN(id)) return;

      if (action === 'delete') deleteNotice(id);
      else if (action === 'edit') editNotice(id);
    });

    // ----- filter & search -----
    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentFilter = btn.dataset.filter;
        render();
      });
    });

    searchInput.addEventListener('input', (e) => {
      searchTerm = e.target.value;
      render();
    });

    // ----- add button -----
    document.getElementById('addNoticeBtn').addEventListener('click', addNotice);

    // ----- init -----
    render();

    // ----- live simulation: rotate dates & update timestamp -----
    setInterval(() => {
      // update timestamp
      updateTimestamp();

      // randomly change one notice's date & maybe title (simulate new activity)
      if (notices.length > 0) {
        const randomIdx = Math.floor(Math.random() * notices.length);
        const notice = notices[randomIdx];
        // rotate date
        const days = ['Mar 18', 'Mar 20', 'Mar 22', 'Mar 24', 'Mar 26', 'Mar 28', 'Mar 30'];
        notice.date = days[Math.floor(Math.random() * days.length)];
        // occasionally update description (simulate edit)
        if (Math.random() > 0.7) {
          const extras = [' (updated)', ' — new details', ' (revised)'];
          if (!notice.desc.endsWith(')')) {
            notice.desc = notice.desc + extras[Math.floor(Math.random() * extras.length)];
          }
        }
        // re-render to reflect changes
        render();
      }
    }, 25000); // every 25 sec
  })();
</script>
</body>
