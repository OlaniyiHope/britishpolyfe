<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>British Poly · Final Year Project Hub</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: #f0f6fe;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        /* main hub - blue & white theme */
        .hub {
            max-width: 1300px;
            width: 100%;
            background: #ffffff;
            border-radius: 44px;
            box-shadow: 0 30px 60px -18px rgba(0, 40, 80, 0.20);
            padding: 28px 32px 32px;
            transition: all 0.2s;
            border: 1px solid #e3edf7;
        }

        /* ----- header ----- */
        .hub-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 14px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .brand .logo-icon {
            width: 56px;
            height: 56px;
            background: #1a3a6b;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            font-weight: 700;
            box-shadow: 0 4px 12px rgba(26, 58, 107, 0.25);
        }

        .brand-text h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: #0a1e3a;
            letter-spacing: -0.3px;
        }

        .brand-text .sub {
            font-size: 0.8rem;
            color: #3a6b9f;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        .brand-text .sub i {
            margin-right: 4px;
            color: #1a3a6b;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .student-badge {
            background: #e8eff8;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: #1a3a6b;
            font-size: 0.9rem;
        }

        .student-badge i {
            margin-right: 6px;
            color: #1a3a6b;
        }

        .live-badge {
            background: #1a3a6b;
            color: white;
            font-weight: 600;
            font-size: 0.7rem;
            padding: 6px 16px 6px 14px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: livePulse 1.8s infinite;
        }

        @keyframes livePulse {
            0% { opacity: 0.8; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.8; transform: scale(0.97); }
        }

        /* ----- stats row ----- */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 28px;
        }

        .stat-card {
            background: #f5f9ff;
            border-radius: 24px;
            padding: 16px 20px;
            border: 1px solid #dce8f5;
            display: flex;
            align-items: center;
            gap: 14px;
            transition: 0.15s;
        }

        .stat-card:hover {
            background: #edf4fd;
            border-color: #b8cfe5;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            background: #dce8f5;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a3a6b;
            font-size: 1.2rem;
        }

        .stat-content .stat-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #3a6b9f;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .stat-content .stat-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #0a1e3a;
            line-height: 1.3;
        }

        /* ----- tabs ----- */
        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 22px;
            flex-wrap: wrap;
            border-bottom: 2px solid #e8eff8;
            padding-bottom: 4px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            padding: 10px 22px;
            border-radius: 40px 40px 0 0;
            font-weight: 500;
            font-size: 0.85rem;
            color: #4a6b8f;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-bottom: 3px solid transparent;
            margin-bottom: -6px;
        }

        .tab-btn i {
            color: #6a8bb0;
        }

        .tab-btn:hover {
            color: #1a3a6b;
            background: #f0f6fe;
        }

        .tab-btn.active {
            color: #1a3a6b;
            font-weight: 600;
            border-bottom-color: #1a3a6b;
            background: #f0f6fe;
        }

        .tab-btn.active i {
            color: #1a3a6b;
        }

        /* ----- project grid ----- */
        .project-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 22px;
            margin-top: 4px;
        }

        .project-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 20px 20px 18px;
            border: 1px solid #e3edf7;
            box-shadow: 0 4px 12px rgba(0, 20, 40, 0.02);
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .project-card:hover {
            border-color: #b8cfe5;
            box-shadow: 0 12px 28px -8px rgba(26, 58, 107, 0.08);
            transform: translateY(-3px);
        }

        .project-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 10px;
        }

        .project-card .project-code {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 40px;
            background: #e8eff8;
            color: #1a3a6b;
        }

        .project-card .status-badge {
            font-size: 0.6rem;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 40px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .status-badge.active {
            background: #d1fae5;
            color: #0b6e4f;
        }

        .status-badge.pending {
            background: #fef3c7;
            color: #8b6914;
        }

        .status-badge.completed {
            background: #dbeafe;
            color: #1e4b8f;
        }

        .project-card .project-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #0a1e3a;
            margin: 2px 0 6px;
            line-height: 1.3;
        }

        .project-card .project-supervisor {
            font-size: 0.8rem;
            color: #4a6b8f;
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 10px;
        }

        .project-card .project-supervisor i {
            color: #1a3a6b;
        }

        .project-card .project-desc {
            font-size: 0.85rem;
            color: #3a5a7a;
            line-height: 1.5;
            flex: 1;
            margin-bottom: 14px;
        }

        .project-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e8eff8;
            padding-top: 14px;
            margin-top: 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .project-card .team {
            font-size: 0.75rem;
            color: #4a6b8f;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .project-card .team i {
            color: #1a3a6b;
        }

        .project-card .action-icons {
            display: flex;
            gap: 14px;
            color: #6a8bb0;
        }

        .project-card .action-icons i {
            cursor: pointer;
            transition: 0.1s;
            font-size: 0.9rem;
        }

        .project-card .action-icons i:hover {
            color: #1a3a6b;
        }

        .project-card .action-icons .delete-icon:hover {
            color: #b91c1c;
        }

        /* empty state */
        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #4a6b8f;
            background: #f5f9ff;
            border-radius: 40px;
            border: 1px dashed #b8cfe5;
        }

        .empty-state i {
            font-size: 2.8rem;
            color: #8aabcf;
            margin-bottom: 12px;
        }

        /* ----- add button ----- */
        .add-project-area {
            margin-top: 24px;
            display: flex;
            justify-content: center;
        }

        .add-btn {
            background: #1a3a6b;
            border: none;
            color: white;
            padding: 12px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            transition: 0.15s;
            box-shadow: 0 4px 14px rgba(26, 58, 107, 0.20);
        }

        .add-btn:hover {
            background: #0e2a4f;
            transform: scale(1.02);
        }

        .add-btn i {
            font-size: 0.9rem;
        }

        /* ----- footer ----- */
        .hub-footer {
            margin-top: 28px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.78rem;
            color: #4a6b8f;
            border-top: 1px solid #e8eff8;
            padding-top: 20px;
        }

        .hub-footer i {
            margin-right: 4px;
            color: #1a3a6b;
        }

        .hub-footer .poly-name {
            font-weight: 600;
            color: #1a3a6b;
        }

        /* ----- responsive ----- */
        @media (max-width: 700px) {
            .hub { padding: 20px 16px 24px; }
            .brand .logo-icon { width: 44px; height: 44px; font-size: 1.4rem; }
            .brand-text h1 { font-size: 1.4rem; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .project-grid { grid-template-columns: 1fr 1fr; }
            .tabs { gap: 4px; }
            .tab-btn { padding: 8px 14px; font-size: 0.75rem; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .project-grid { grid-template-columns: 1fr; }
            .brand-text h1 { font-size: 1.2rem; }
            .hub-header { flex-direction: column; align-items: flex-start; }
            .header-right { width: 100%; justify-content: flex-start; }
            .add-btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

<div class="hub" id="projectHub">
    <!-- header -->
    <div class="hub-header">
        <div class="brand">
            <div class="logo-icon">BP</div>
            <div class="brand-text">
                <h1>British Poly</h1>
                <div class="sub"><i class="fas fa-graduation-cap"></i> Final Year Project Hub</div>
            </div>
        </div>
        <div class="header-right">
            <span class="student-badge"><i class="fas fa-id-badge"></i> S-2026-014 · Sarah Chen</span>
            <span class="live-badge"><i class="fas fa-circle" style="font-size:0.45rem;"></i> LIVE</span>
        </div>
    </div>

    <!-- stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-project-diagram"></i></div>
            <div class="stat-content">
                <div class="stat-label">Total Projects</div>
                <div class="stat-value" id="totalProjects">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-play-circle"></i></div>
            <div class="stat-content">
                <div class="stat-label">Active</div>
                <div class="stat-value" id="activeProjects">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-clock"></i></div>
            <div class="stat-content">
                <div class="stat-label">Pending</div>
                <div class="stat-value" id="pendingProjects">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
            <div class="stat-content">
                <div class="stat-label">Completed</div>
                <div class="stat-value" id="completedProjects">0</div>
            </div>
        </div>
    </div>

    <!-- tabs -->
    <div class="tabs">
        <button class="tab-btn active" data-filter="all"><i class="fas fa-th"></i> All</button>
        <button class="tab-btn" data-filter="active"><i class="fas fa-play-circle"></i> Active</button>
        <button class="tab-btn" data-filter="pending"><i class="fas fa-clock"></i> Pending</button>
        <button class="tab-btn" data-filter="completed"><i class="fas fa-check-circle"></i> Completed</button>
    </div>

    <!-- project grid -->
    <div class="project-grid" id="projectGrid">
        <!-- injected by js -->
    </div>

    <!-- add button -->
    <div class="add-project-area">
        <button class="add-btn" id="addProjectBtn"><i class="fas fa-plus-circle"></i> New Project</button>
    </div>

    <!-- footer -->
    <div class="hub-footer">
        <span><i class="far fa-clock"></i> updated: <span id="updateTime">just now</span></span>
        <span><i class="fas fa-university"></i> <span class="poly-name">British Poly</span> · Final Year Hub</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ----- initial projects -----
        let projects = [
            { id: 1, title: 'AI-Powered Student Advisor', code: 'FYP-101', supervisor: 'Dr. Alan Turing', status: 'active', team: 'Sarah, James, Aisha', desc: 'Developing an intelligent chatbot to assist students with course selection and academic planning.' },
            { id: 2, title: 'Smart Campus IoT Network', code: 'FYP-102', supervisor: 'Prof. Grace Hopper', status: 'active', team: 'Marcus, Elena, David', desc: 'Building a low-power sensor network for real-time campus environmental monitoring.' },
            { id: 3, title: 'Blockchain for Student Records', code: 'FYP-103', supervisor: 'Dr. Edgar Codd', status: 'pending', team: 'Sophie, Carlos, Lena', desc: 'Implementing a secure, decentralized system for managing academic credentials.' },
            { id: 4, title: 'VR Campus Tour Experience', code: 'FYP-104', supervisor: 'Prof. Tim Berners-Lee', status: 'completed', team: 'Olivia, Ethan, Mia', desc: 'Creating an immersive virtual reality tour of British Poly for prospective students.' },
            { id: 5, title: 'Mobile Study Planner App', code: 'FYP-105', supervisor: 'Dr. Emmy Noether', status: 'active', team: 'Noah, Emma, Lucas', desc: 'Cross-platform app for students to manage deadlines, tasks, and study sessions.' },
        ];

        // ----- state -----
        let currentFilter = 'all';

        // DOM refs
        const grid = document.getElementById('projectGrid');
        const tabBtns = document.querySelectorAll('.tab-btn');
        const totalProjectsEl = document.getElementById('totalProjects');
        const activeProjectsEl = document.getElementById('activeProjects');
        const pendingProjectsEl = document.getElementById('pendingProjects');
        const completedProjectsEl = document.getElementById('completedProjects');
        const updateTimeSpan = document.getElementById('updateTime');

        // ----- helpers -----
        function updateTimestamp() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            updateTimeSpan.textContent = `${h}:${m}`;
        }

        function getStatusBadge(status) {
            const map = {
                'active': '<span class="status-badge active"><i class="fas fa-play-circle"></i> Active</span>',
                'pending': '<span class="status-badge pending"><i class="fas fa-clock"></i> Pending</span>',
                'completed': '<span class="status-badge completed"><i class="fas fa-check-circle"></i> Completed</span>'
            };
            return map[status] || map.pending;
        }

        // ----- render -----
        function render() {
            // filter
            let filtered = projects;
            if (currentFilter !== 'all') {
                filtered = projects.filter(p => p.status === currentFilter);
            }

            // update stats
            const total = projects.length;
            const active = projects.filter(p => p.status === 'active').length;
            const pending = projects.filter(p => p.status === 'pending').length;
            const completed = projects.filter(p => p.status === 'completed').length;

            totalProjectsEl.textContent = total;
            activeProjectsEl.textContent = active;
            pendingProjectsEl.textContent = pending;
            completedProjectsEl.textContent = completed;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-folder-open"></i>
                        <p style="font-weight:500; margin-top:6px;">No projects in this category</p>
                        <p style="font-size:0.85rem;">Start a new project using the button below</p>
                    </div>
                `;
                updateTimestamp();
                return;
            }

            let html = '';
            filtered.forEach(p => {
                const badgeHtml = getStatusBadge(p.status);
                html += `
                    <div class="project-card" data-id="${p.id}">
                        <div class="card-top">
                            <span class="project-code">${p.code}</span>
                            ${badgeHtml}
                        </div>
                        <div class="project-title">${p.title}</div>
                        <div class="project-supervisor"><i class="fas fa-user-tie"></i> ${p.supervisor}</div>
                        <div class="project-desc">${p.desc}</div>
                        <div class="card-footer">
                            <span class="team"><i class="fas fa-users"></i> ${p.team}</span>
                            <div class="action-icons">
                                <i class="far fa-edit" data-action="edit" data-id="${p.id}"></i>
                                <i class="far fa-trash-alt delete-icon" data-action="delete" data-id="${p.id}"></i>
                            </div>
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            updateTimestamp();
        }

        // ----- CRUD -----
        function addProject() {
            const title = prompt('Project title:');
            if (title === null || title.trim() === '') return;
            const supervisor = prompt('Supervisor name:') || 'Staff';
            const team = prompt('Team members (comma separated):') || 'Student';
            const desc = prompt('Brief description:') || 'Project description';
            const statusOptions = ['active', 'pending', 'completed'];
            const statusInput = prompt('Status (active / pending / completed):', 'active');
            let status = 'active';
            if (statusInput && statusOptions.includes(statusInput.trim().toLowerCase())) {
                status = statusInput.trim().toLowerCase();
            }
            const newId = projects.length ? Math.max(...projects.map(p => p.id)) + 1 : 1;
            const code = `FYP-${String(newId).padStart(3, '0')}`;

            projects.push({
                id: newId,
                title: title.trim(),
                code: code,
                supervisor: supervisor.trim(),
                status: status,
                team: team.trim(),
                desc: desc.trim(),
            });
            render();
        }

        function deleteProject(id) {
            if (!confirm('Remove this project?')) return;
            projects = projects.filter(p => p.id !== id);
            render();
        }

        function editProject(id) {
            const project = projects.find(p => p.id === id);
            if (!project) return;

            const newTitle = prompt('Edit title:', project.title);
            if (newTitle === null) return;
            const newSupervisor = prompt('Edit supervisor:', project.supervisor);
            if (newSupervisor === null) return;
            const newTeam = prompt('Edit team:', project.team);
            if (newTeam === null) return;
            const newDesc = prompt('Edit description:', project.desc);
            if (newDesc === null) return;
            const newStatus = prompt('Edit status (active/pending/completed):', project.status);
            let status = project.status;
            if (newStatus !== null && ['active','pending','completed'].includes(newStatus.trim().toLowerCase())) {
                status = newStatus.trim().toLowerCase();
            }

            project.title = newTitle.trim() || project.title;
            project.supervisor = newSupervisor.trim() || project.supervisor;
            project.team = newTeam.trim() || project.team;
            project.desc = newDesc.trim() || project.desc;
            project.status = status;
            render();
        }

        // ----- event delegation -----
        grid.addEventListener('click', (e) => {
            const target = e.target.closest('[data-action]');
            if (!target) return;
            const action = target.dataset.action;
            const id = Number(target.dataset.id);
            if (isNaN(id)) return;

            if (action === 'delete') deleteProject(id);
            else if (action === 'edit') editProject(id);
        });

        // ----- tabs -----
        tabBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                tabBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        // ----- add button -----
        document.getElementById('addProjectBtn').addEventListener('click', addProject);

        // ----- init -----
        render();

        // ----- live simulation: update timestamp & random status change -----
        setInterval(() => {
            updateTimestamp();

            // randomly change a project's status (simulate live progress)
            if (projects.length > 0 && Math.random() > 0.65) {
                const randomIdx = Math.floor(Math.random() * projects.length);
                const p = projects[randomIdx];
                const statuses = ['active', 'pending', 'completed'];
                let newStatus = statuses[Math.floor(Math.random() * statuses.length)];
                while (newStatus === p.status) {
                    newStatus = statuses[Math.floor(Math.random() * statuses.length)];
                }
                p.status = newStatus;
                render();
            }
        }, 25000);
    })();
