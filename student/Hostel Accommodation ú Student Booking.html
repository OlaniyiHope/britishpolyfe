<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
    <title>Hostel Accommodation · Student Booking</title>
    <!-- Font Awesome 6 (free) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }

        body {
            background: #eef3fa;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .hostel-portal {
            max-width: 1300px;
            width: 100%;
            background: #ffffff;
            border-radius: 44px;
            box-shadow: 0 30px 60px -18px rgba(0, 20, 40, 0.18);
            padding: 28px 32px 32px;
            transition: all 0.2s;
        }

        /* header */
        .portal-header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            gap: 14px;
        }

        .portal-header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0a1e32;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .portal-header h1 i {
            color: #7c3aed;
            font-size: 2rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }

        .student-badge {
            background: #e6edf8;
            padding: 8px 20px;
            border-radius: 60px;
            font-weight: 500;
            color: #1c3857;
            font-size: 0.9rem;
        }

        .student-badge i {
            margin-right: 6px;
            color: #2563eb;
        }

        .live-badge {
            background: #dc3545;
            color: white;
            font-weight: 600;
            font-size: 0.7rem;
            padding: 6px 16px 6px 14px;
            border-radius: 40px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            animation: livePulse 1.8s infinite;
        }

        @keyframes livePulse {
            0% { opacity: 0.75; transform: scale(0.97); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.75; transform: scale(0.97); }
        }

        /* stats */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin-bottom: 26px;
        }

        .stat-card {
            background: #f8fbff;
            border-radius: 24px;
            padding: 16px 18px;
            border: 1px solid #e7eef9;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .stat-icon {
            width: 44px;
            height: 44px;
            background: #e2ebf9;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #7c3aed;
            font-size: 1.2rem;
        }

        .stat-content .stat-label {
            font-size: 0.7rem;
            font-weight: 500;
            color: #4f6e8e;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .stat-content .stat-value {
            font-size: 1.4rem;
            font-weight: 700;
            color: #0b1e31;
            line-height: 1.3;
        }

        /* toolbar */
        .toolbar {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            gap: 16px;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: #f2f7fd;
            border-radius: 60px;
            padding: 0 8px 0 20px;
            flex: 1 1 200px;
            min-width: 150px;
            border: 1px solid transparent;
            transition: 0.15s;
        }

        .search-box:focus-within {
            background: #ffffff;
            border-color: #7c3aed;
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.10);
        }

        .search-box i {
            color: #6f8aa8;
        }

        .search-box input {
            border: none;
            background: transparent;
            padding: 12px 12px;
            font-size: 0.95rem;
            width: 100%;
            outline: none;
            color: #11273f;
        }

        .search-box input::placeholder {
            color: #8da3bd;
        }

        .filter-group {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .filter-btn {
            background: white;
            border: 1px solid #d8e2ef;
            padding: 7px 18px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.8rem;
            color: #1d3957;
            cursor: pointer;
            transition: 0.15s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .filter-btn i {
            font-size: 0.7rem;
            color: #617e9e;
        }

        .filter-btn:hover {
            background: #e9f0fa;
            border-color: #a6bdd9;
        }

        .filter-btn.active {
            background: #7c3aed;
            border-color: #7c3aed;
            color: white;
        }

        .filter-btn.active i {
            color: white;
        }

        /* room grid */
        .room-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 22px;
            margin-top: 4px;
        }

        .room-card {
            background: #ffffff;
            border-radius: 28px;
            padding: 20px 20px 18px;
            border: 1px solid #ebf1f9;
            box-shadow: 0 4px 12px rgba(0, 20, 30, 0.02);
            transition: 0.2s ease;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .room-card:hover {
            border-color: #c5d7ed;
            box-shadow: 0 12px 28px -8px rgba(22, 60, 110, 0.07);
            transform: translateY(-3px);
        }

        .room-card .card-top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 8px;
        }

        .room-card .room-number {
            font-size: 0.65rem;
            font-weight: 700;
            padding: 4px 14px;
            border-radius: 40px;
            background: #e9eff8;
            color: #1e3b5a;
        }

        .room-card .price-tag {
            font-size: 0.8rem;
            font-weight: 700;
            color: #059669;
            background: #d1fae5;
            padding: 4px 14px;
            border-radius: 40px;
        }

        .room-card .room-title {
            font-weight: 600;
            font-size: 1.1rem;
            color: #0b1e31;
            margin: 4px 0 6px;
        }

        .room-card .room-details {
            font-size: 0.8rem;
            color: #4f6e8e;
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
        }

        .room-card .room-details i {
            color: #7c3aed;
            width: 16px;
        }

        .room-card .room-desc {
            font-size: 0.85rem;
            color: #2f4b69;
            line-height: 1.5;
            flex: 1;
            margin-bottom: 14px;
        }

        .room-card .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #e8eff7;
            padding-top: 14px;
            margin-top: 4px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .room-card .availability {
            font-size: 0.7rem;
            color: #4f6e8e;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .room-card .availability .avail-badge {
            font-weight: 600;
            padding: 2px 12px;
            border-radius: 40px;
            font-size: 0.65rem;
        }

        .avail-badge.available {
            background: #d1fae5;
            color: #0b6e4f;
        }

        .avail-badge.limited {
            background: #fef3c7;
            color: #8b6914;
        }

        .avail-badge.full {
            background: #fee9e7;
            color: #b91c1c;
        }

        .book-btn {
            background: #7c3aed;
            border: none;
            color: white;
            padding: 6px 20px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: 0.1s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .book-btn:hover {
            background: #5b21b6;
            transform: scale(1.02);
        }

        .book-btn:disabled {
            background: #b8cfe5;
            cursor: not-allowed;
            opacity: 0.6;
            transform: none;
        }

        .book-btn.booked {
            background: #059669;
        }

        .book-btn.booked:hover {
            background: #047857;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 50px 20px;
            color: #4b6a89;
            background: #fafdff;
            border-radius: 48px;
            border: 1px dashed #c2d6ec;
        }

        .empty-state i {
            font-size: 2.8rem;
            color: #b0c8e0;
            margin-bottom: 12px;
        }

        /* footer */
        .portal-footer {
            margin-top: 28px;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 0.78rem;
            color: #577392;
            border-top: 1px solid #e7eef8;
            padding-top: 20px;
        }

        .portal-footer i {
            margin-right: 4px;
        }

        /* responsive */
        @media (max-width: 700px) {
            .hostel-portal { padding: 20px 16px 24px; }
            .portal-header h1 { font-size: 1.5rem; }
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .toolbar { flex-direction: column; align-items: stretch; }
            .room-grid { grid-template-columns: 1fr 1fr; }
        }

        @media (max-width: 480px) {
            .stats-grid { grid-template-columns: 1fr; }
            .room-grid { grid-template-columns: 1fr; }
            .filter-group { justify-content: center; }
        }
    </style>
</head>
<body>

<div class="hostel-portal" id="hostelApp">
    <!-- header -->
    <div class="portal-header">
        <h1><i class="fas fa-bed"></i> Hostel Booking</h1>
        <div class="header-right">
            <span class="student-badge"><i class="fas fa-id-badge"></i> S-2026-014 · Sarah Chen</span>
            <span class="live-badge"><i class="fas fa-circle" style="font-size:0.45rem;"></i> LIVE</span>
        </div>
    </div>

    <!-- stats -->
    <div class="stats-grid">
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-building"></i></div>
            <div class="stat-content">
                <div class="stat-label">Total Rooms</div>
                <div class="stat-value" id="totalRooms">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-check-circle"></i></div>
            <div class="stat-content">
                <div class="stat-label">Available</div>
                <div class="stat-value" id="availableRooms">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-clock"></i></div>
            <div class="stat-content">
                <div class="stat-label">Limited</div>
                <div class="stat-value" id="limitedRooms">0</div>
            </div>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-bookmark"></i></div>
            <div class="stat-content">
                <div class="stat-label">My Bookings</div>
                <div class="stat-value" id="myBookings">0</div>
            </div>
        </div>
    </div>

    <!-- toolbar -->
    <div class="toolbar">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="searchInput" placeholder="Search rooms..." />
        </div>
        <div class="filter-group">
            <button class="filter-btn active" data-filter="all"><i class="fas fa-th"></i> All</button>
            <button class="filter-btn" data-filter="available"><i class="fas fa-check-circle" style="color:#0b6e4f;"></i> Available</button>
            <button class="filter-btn" data-filter="limited"><i class="fas fa-clock" style="color:#8b6914;"></i> Limited</button>
            <button class="filter-btn" data-filter="full"><i class="fas fa-times-circle" style="color:#b91c1c;"></i> Full</button>
        </div>
    </div>

    <!-- room grid -->
    <div class="room-grid" id="roomGrid">
        <!-- injected by js -->
    </div>

    <!-- footer -->
    <div class="portal-footer">
        <span><i class="far fa-clock"></i> updated: <span id="updateTime">just now</span></span>
        <span><i class="fas fa-sync-alt fa-fw"></i> auto‑sync</span>
    </div>
</div>

<script>
    (function() {
        "use strict";

        // ----- room data -----
        let rooms = [
            { id: 1, name: 'Single Deluxe', number: 'A-101', price: 450, type: 'single', availability: 'available', desc: 'Spacious single room with private bathroom and study desk. Wi-Fi included.' },
            { id: 2, name: 'Double Standard', number: 'B-204', price: 350, type: 'double', availability: 'available', desc: 'Comfortable double room shared with one roommate. Furnished with beds and desks.' },
            { id: 3, name: 'Single Basic', number: 'C-312', price: 300, type: 'single', availability: 'limited', desc: 'Budget-friendly single room with shared bathroom. Includes basic furniture.' },
            { id: 4, name: 'Triple Suite', number: 'D-405', price: 280, type: 'triple', availability: 'full', desc: 'Large suite for three students. Shared living area and kitchenette.' },
            { id: 5, name: 'Double Premium', number: 'A-205', price: 420, type: 'double', availability: 'available', desc: 'Premium double room with ensuite bathroom and air conditioning.' },
            { id: 6, name: 'Single Studio', number: 'E-101', price: 520, type: 'single', availability: 'limited', desc: 'Private studio with kitchenette, ideal for independent living.' },
            { id: 7, name: 'Quad Shared', number: 'F-302', price: 220, type: 'quad', availability: 'available', desc: 'Four-person shared room with bunk beds and common study area.' },
        ];

        // ----- state: booked room IDs (simulate student bookings) -----
        let bookedIds = new Set([2, 5]); // Sarah has booked Double Standard and Double Premium

        // filter state
        let currentFilter = 'all';
        let searchTerm = '';

        // DOM refs
        const grid = document.getElementById('roomGrid');
        const searchInput = document.getElementById('searchInput');
        const filterBtns = document.querySelectorAll('.filter-btn');
        const totalRoomsEl = document.getElementById('totalRooms');
        const availableRoomsEl = document.getElementById('availableRooms');
        const limitedRoomsEl = document.getElementById('limitedRooms');
        const myBookingsEl = document.getElementById('myBookings');
        const updateTimeSpan = document.getElementById('updateTime');

        // ----- helpers -----
        function updateTimestamp() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2,'0');
            const m = String(now.getMinutes()).padStart(2,'0');
            updateTimeSpan.textContent = `${h}:${m}`;
        }

        function getAvailBadge(availability) {
            const map = {
                'available': '<span class="avail-badge available"><i class="fas fa-check-circle"></i> Available</span>',
                'limited': '<span class="avail-badge limited"><i class="fas fa-clock"></i> Limited</span>',
                'full': '<span class="avail-badge full"><i class="fas fa-times-circle"></i> Full</span>'
            };
            return map[availability] || map.available;
        }

        function getAvailClass(availability) {
            return availability;
        }

        // ----- render -----
        function render() {
            // filter + search
            let filtered = rooms.filter(r => {
                if (currentFilter !== 'all' && r.availability !== currentFilter) return false;
                if (searchTerm.trim() !== '') {
                    const term = searchTerm.trim().toLowerCase();
                    return r.name.toLowerCase().includes(term) ||
                           r.number.toLowerCase().includes(term) ||
                           r.type.toLowerCase().includes(term);
                }
                return true;
            });

            // update stats
            const total = rooms.length;
            const available = rooms.filter(r => r.availability === 'available').length;
            const limited = rooms.filter(r => r.availability === 'limited').length;
            const myBookings = bookedIds.size;

            totalRoomsEl.textContent = total;
            availableRoomsEl.textContent = available;
            limitedRoomsEl.textContent = limited;
            myBookingsEl.textContent = myBookings;

            if (filtered.length === 0) {
                grid.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-bed"></i>
                        <p style="font-weight:500; margin-top:6px;">No rooms match</p>
                        <p style="font-size:0.85rem;">Try adjusting filters or search</p>
                    </div>
                `;
                updateTimestamp();
                return;
            }

            let html = '';
            filtered.forEach(r => {
                const isBooked = bookedIds.has(r.id);
                const availBadge = getAvailBadge(r.availability);
                const availClass = getAvailClass(r.availability);

                let btnHtml = '';
                if (isBooked) {
                    btnHtml = `<button class="book-btn booked" data-id="${r.id}"><i class="fas fa-check"></i> Booked</button>`;
                } else if (r.availability === 'full') {
                    btnHtml = `<button class="book-btn" disabled><i class="fas fa-times"></i> Full</button>`;
                } else {
                    btnHtml = `<button class="book-btn" data-id="${r.id}"><i class="fas fa-plus"></i> Book</button>`;
                }

                html += `
                    <div class="room-card" data-id="${r.id}">
                        <div class="card-top">
                            <span class="room-number"><i class="fas fa-hashtag" style="color:#7c3aed;font-size:0.6rem;"></i> ${r.number}</span>
                            <span class="price-tag">$${r.price}/mo</span>
                        </div>
                        <div class="room-title">${r.name}</div>
                        <div class="room-details">
                            <span><i class="fas fa-users"></i> ${r.type.charAt(0).toUpperCase() + r.type.slice(1)}</span>
                            <span><i class="fas fa-wifi"></i> Wi-Fi</span>
                            <span><i class="fas fa-shower"></i> ${r.type === 'single' ? 'Private' : 'Shared'} bath</span>
                        </div>
                        <div class="room-desc">${r.desc}</div>
                        <div class="card-footer">
                            <span class="availability">${availBadge}</span>
                            ${btnHtml}
                        </div>
                    </div>
                `;
            });

            grid.innerHTML = html;
            updateTimestamp();
        }

        // ----- book / cancel booking -----
        function toggleBooking(id) {
            const room = rooms.find(r => r.id === id);
            if (!room) return;

            if (bookedIds.has(id)) {
                // cancel booking
                bookedIds.delete(id);
                render();
                return;
            }

            if (room.availability === 'full') {
                alert('This room is full and cannot be booked.');
                return;
            }

            // book
            bookedIds.add(id);
            render();
            alert(`✅ Booked "${room.name}" (${room.number}) successfully!`);
        }

        // ----- event delegation -----
        grid.addEventListener('click', (e) => {
            const btn = e.target.closest('.book-btn');
            if (!btn) return;
            if (btn.disabled) return;
            const id = parseInt(btn.dataset.id);
            if (!isNaN(id)) toggleBooking(id);
        });

        // ----- filter & search -----
        filterBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                filterBtns.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                currentFilter = btn.dataset.filter;
                render();
            });
        });

        searchInput.addEventListener('input', (e) => {
            searchTerm = e.target.value;
            render();
        });

        // ----- init -----
        render();

        // ----- live simulation: update timestamp & random availability change -----
        setInterval(() => {
            updateTimestamp();

            if (Math.random() > 0.7) {
                const randomIdx = Math.floor(Math.random() * rooms.length);
                const room = rooms[randomIdx];
                // don't change if already booked (avoid confusion)
                if (bookedIds.has(room.id)) return;

                const statuses = ['available', 'limited', 'full'];
                let newStatus = statuses[Math.floor(Math.random() * statuses.length)];
                while (newStatus === room.availability) {
                    newStatus = statuses[Math.floor(Math.random() * statuses.length)];
                }
                room.availability = newStatus;
                render();
            }
        }, 25000);
    })();
</script>
</body>
